<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js" integrity="sha384-k6d4wzSIapyDyv1kpU366/PK5hCdSbCRGRCMv+eplOQJWyd1fbcAu9OCUj5zNLiq" crossorigin="anonymous"></script>
    <title>Task2</title>
</head>
<body>
    
    <div class="container mt-3">

        <form action="" class="was-validated">

            <div class="row">
                <div class="col-6">
                    <label for="tmail" class="form-label">
                        Email
                    </label>

                    <input type="email" name="unm" id="tmail" class="form-control" required>
                    <span class="valid-feedback">Correct Data</span>
                    <span class="invalid-feedback">This field is required</span>

                </div>

                <div class="col-6">
                    <label for="tpass" class="form-label">
                        Password
                    </label>

                    <input type="password" name="upass" id="tpass" class="form-control" required>
                    <span class="valid-feedback">Correct Data</span>
                    <span class="invalid-feedback">This field is required</span>
                </div>
            </div>

            <div class="row">
                <div class="col-12">
                    <label for="tad" class="form-label">
                        Address
                    </label>

                    <input type="text" name="unm" id="tad" class="form-control" placeholder="1234 Main St" required>
                    <span class="valid-feedback">Correct Data</span>
                    <span class="invalid-feedback">This field is required</span>

                </div>

            </div>
            <div class="row">
                <div class="col-12">
                    <label for="tad" class="form-label">
                        Address 2
                    </label>

                    <input type="text" name="unm" id="tad" class="form-control"  placeholder="Apartment, studio , or floor" required>
                    <span class="valid-feedback">Correct Data</span>
                    <span class="invalid-feedback">This field is required</span>

                </div>

            </div>


            <div class="row">
                <div class="col-6">
                    <label for="tad" class="form-label">
                        City
                    </label>

                    <input type="text" name="unm" id="tad" class="form-control"   required>
                    <span class="valid-feedback">Correct Data</span>
                    <span class="invalid-feedback">This field is required</span>

                </div>

                <div class="col-4">
                    <label for="tad" class="form-label">
                        State
                    </label>

                    <select name="state" class="form-control" required>
                        <option value="">Select Your State</option>
                        <option value="mh">Maharashtra</option>
                        <option value="up">Uttar Pradesh</option>
                        <option value="mp">Madhya pradesh</option>
                        <option value="gj">Gujarat</option>
                        <option value="pb">Punjab</option>
                        <option value="kl">Kerela</option>
                        <option value="ap">Andhra Pradesh</option>
                        <option value="rj">Rajasthan</option>
                    </select>
                    <span class="valid-feedback">Correct Data</span>
                    <span class="invalid-feedback">This field is required</span>

                </div>


                <div class="col-2">
                    <label for="tad" class="form-label">
                        Zip
                    </label>

                    <input type="number" name="unm" id="tad" class="form-control"  required>
                    <span class="valid-feedback">Correct Data</span>
                    <span class="invalid-feedback">This field is required</span>

                </div>

            </div>
            <br>
            <label for="chk">
                <input type="checkbox" name="term" value="true" class="form-check-input ">
                Check Me Out</label>
                <br>
                <br>
            <button type="submit" class="btn btn-primary">Sign in</button>





        </form>





    </div>

</body>
</html>
