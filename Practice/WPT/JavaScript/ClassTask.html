<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js" integrity="sha384-k6d4wzSIapyDyv1kpU366/PK5hCdSbCRGRCMv+eplOQJWyd1fbcAu9OCUj5zNLiq" crossorigin="anonymous"></script>
    <title>Calculator</title>
</head>
<body>

   <div class="container m-10">

    <form class="myform mt-5">

        <input type="text" name="num1" class="form-control" id="num1" placeholder="Enter First Number"><br>
        <input type="text" name="num2" class="form-control" id="num2" placeholder="Enter Second Number"><br>

        <button type="button" onclick="add()" class="btn btn-outline-primary">+Add</button>
        <!-- <div id="result" class="text-primary" style="border: 5px solid red; height: 50px; width: 100px; align-content: center; margin-top: 10px;"> Result :- </div> -->
        
        <h2 style="border: 5px solid red; height: 50px; width: 300px; align-content: center; margin-top: 10px;">Result :- <h2 id="result"></h2></h2>

    </from>

   </div>


   <script>

    function add()
    {
        // window.alert("HII");

        let no1 = document.getElementById("num1").value;
        let no2 = document.getElementById("num2").value;
       
       
        document.getElementById("result").innerHTML =( parseInt(no1) + parseInt(no2) );
        
    }


   </script>
    
</body>
</html>
