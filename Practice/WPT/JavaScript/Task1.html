<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js" integrity="sha384-k6d4wzSIapyDyv1kpU366/PK5hCdSbCRGRCMv+eplOQJWyd1fbcAu9OCUj5zNLiq" crossorigin="anonymous"></script>
    
    <title>Calculator</title>

    <style>

        .form-control{
            width: 88%;
           
        }

        .bubu{
            width: 50%;
            margin: 50px auto;

            padding-left: 60px;
            
        }
       


    </style>


</head>
<body>

    <div class="container">

        <form class=" border border-info bubu">
            <input type="text" id="n1" placeholder="Enter First Number" class="form-control mt-3">
            <input type="text" id="n2" placeholder="Enter Second Number" class="form-control mt-3" >

            <button type="button" onclick="add()" class="btn btn-primary mt-3 mx-3">Add</button>
            <button type="button" onclick="sub()" class="btn btn-primary mt-3 mx-3">Sub</button>
            <button type="button" onclick="mul()" class="btn btn-primary mt-3 mx-3">Mul</button>
            <button type="button" onclick="div()" class="btn btn-primary mt-3 mx-3">Div</button>

            <div class="mt-3"><h2 class="d-inline ">Result:-  <h2 class="d-inline" id="rt"></h2></h2></div>

        </form>

    </div>


    <script>
        let add = () => {
            let no1 = document.getElementById("n1").value;
            let no2 = document.getElementById("n2").value;

            document.getElementById("rt").innerHTML = (parseInt(no1) + parseInt(no2));
        }

        let sub = () => {
            let no1 = document.getElementById("n1").value;
            let no2 = document.getElementById("n2").value;

            document.getElementById("rt").innerHTML = (parseInt(no1) - parseInt(no2));
        }

        let mul = () => {
            let no1 = document.getElementById("n1").value;
            let no2 = document.getElementById("n2").value;

            document.getElementById("rt").innerHTML = (parseInt(no1) * parseInt(no2));
        }

        let div = () => {
            let no1 = document.getElementById("n1").value;
            let no2 = document.getElementById("n2").value;

            document.getElementById("rt").innerHTML = (parseInt(no1) / parseInt(no2));
        }
    </script>
    
</body>
</html>
