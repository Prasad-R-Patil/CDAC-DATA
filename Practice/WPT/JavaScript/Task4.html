<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js" integrity="sha384-k6d4wzSIapyDyv1kpU366/PK5hCdSbCRGRCMv+eplOQJWyd1fbcAu9OCUj5zNLiq" crossorigin="anonymous"></script>
    
    <title>CellNumber</title>

    <style>
        .tc{
            width: 400px;
            height: 400px;
            margin: 0 auto;
        }
        .form-control{
            display: inline;
            width: 60%;
            margin-top: 30px;
        }
        .pad{
            padding-left: 50px;
            margin-top: 5px;
        }
        .m{
            margin-top: 30px;
            margin-left: 120px;
        }
        .war{
            width: 400px;
            color: red;
            margin-top: 10px ;
            padding: 10px;
            background-color: aquamarine;
            border: 4px solid purple;
            border-radius: 10px;
        }

    </style>
</head>
<body>
    
    <div class="container mt-5 ">
        <table class="table table-bordered tc text-center align-middle ">
            <tr>
                <td id="1">1</td>
                <td id="2">2</td>
                <td id="3">3</td>
            </tr>
            <tr>
                <td id="4">4</td>
                <td id="5">5</td>
                <td id="6">6</td>
            </tr>
            <tr>
                <td id="7">7</td>
                <td id="8">8</td>
                <td id="9">9</td>
            </tr>
        </table>

        <div class="tc">
            <form class="form">

               <div>
                <label for="cn" class="form-label">Select Cell Number :- </label>
                <input type="text" id="cn" class="form-control">
               </div>
                
                <div class="pad">
                    <label for="sc">Select Color :- </label>
                    <!-- <select name="" id="sc" class="form-control">
                        <option value="">Select Color</option>
                        <option value="red">Red</option>
                        <option value="green">Green</option>
                        <option value="yellow">Yellow</option>
                        <option value="blue">Blue</option>
                        <option value="purple">Purple</option>
                        <option value="pink">Pink</option>
                        <option value="black">Black</option>
                        <option value="aqua">Aqua</option>
                        <option value="orange">Orange</option>
                    </select> -->

                    <input type="color" id="sc">
                </div>

                <button type="button" onclick="colors()" class="btn btn-primary m">Set Background Color</button>

                <div class="war">
                    <h2 id="war"></h2>
                </div>
            </form>
        </div>


    </div>


    <script>

        let colors = () => 
        {
            let cn = document.getElementById("cn").value;
            // console.log(cn);

            let col = document.getElementById("sc").value;
            // console.log(col);

            switch(parseInt(cn))
            {
                case 1 :
                    {
                        document.getElementById("1").style.backgroundColor=col;
                        document.getElementById("war").innerHTML = "Color Changed ...";
                        break;
                    }
                case 2 :
                    {
                        document.getElementById("2").style.backgroundColor=col;
                        document.getElementById("war").innerHTML = "Color Changed ...";
                        break;
                    }
                case 3 :
                    {
                        document.getElementById("3").style.backgroundColor=col;
                        document.getElementById("war").innerHTML = "Color Changed ...";
                        break;
                    }
                case 4 :
                    {
                        document.getElementById("4").style.backgroundColor=col;
                        document.getElementById("war").innerHTML = "Color Changed ...";
                        break;
                    }
                case 5 :
                    {
                        document.getElementById("5").style.backgroundColor=col;
                        document.getElementById("war").innerHTML = "Color Changed ...";
                        break;
                    }
                case 6 :
                    {
                        document.getElementById("6").style.backgroundColor=col;
                        document.getElementById("war").innerHTML = "Color Changed ...";
                        break;
                    }
                case 7 :
                    {
                        document.getElementById("7").style.backgroundColor=col;
                        document.getElementById("war").innerHTML = "Color Changed ...";
                        break;
                    }
                case 8 :
                    {
                        document.getElementById("8").style.backgroundColor=col;
                        document.getElementById("war").innerHTML = "Color Changed ...";
                        break;
                    }
                case 9 :
                    {
                        document.getElementById("9").style.backgroundColor=col;
                        document.getElementById("war").innerHTML = "Color Changed ...";
                        break;
                    }
                default :
                    {
                        document.getElementById("war").innerHTML = "Plz Enter Correct Cell-No";
                    } 
                    
            }




        }

    </script>

</body>
</html>
