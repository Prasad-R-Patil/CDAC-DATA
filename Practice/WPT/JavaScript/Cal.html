<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Calculator</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet"/>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js"></script>

  <style>
    body {
      background-color: #f8f9fa;
    }

    .calculator {
      max-width: 400px;
      margin: 80px auto;
      padding: 30px;
      background-color: #ffffff;
      box-shadow: 0px 0px 15px rgba(0,0,0,0.1);
      border-radius: 12px;
    }

    .btn-group button {
      width: 23%;
    }

    #result {
      font-size: 1.5rem;
      margin-top: 15px;
      font-weight: bold;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="calculator text-center">
    <h3 class="mb-4">Simple Calculator</h3>

    <form id="calcForm">
      <input type="number" id="num1" class="form-control mb-3" placeholder="Enter First Number" required>
      <input type="number" id="num2" class="form-control mb-3" placeholder="Enter Second Number" required>

      <div class="btn-group d-flex justify-content-between mb-3" role="group">
        <button type="button" class="btn btn-outline-primary" onclick="calculate('add')">+ADD</button>
        <button type="button" class="btn btn-outline-success" onclick="calculate('sub')">−SUB</button>
        <button type="button" class="btn btn-outline-warning" onclick="calculate('mul')">×MUL</button>
        <button type="button" class="btn btn-outline-danger" onclick="calculate('div')">÷DIV</button>
      </div>

      <div id="result" class="text-primary"></div>
    </form>
  </div>
</div>

<script>
  function calculate(operation) {
    const num1 = parseFloat(document.getElementById("num1").value);
    const num2 = parseFloat(document.getElementById("num2").value);
    let result;

    if (isNaN(num1) || isNaN(num2)) {
      document.getElementById("result").innerText = "Please enter valid numbers!";
      return;
    }

    switch(operation) {
      case 'add':
        result = num1 + num2;
        break;
      case 'sub':
        result = num1 - num2;
        break;
      case 'mul':
        result = num1 * num2;
        break;
      case 'div':
        result = num2 !== 0 ? num1 / num2 : "Cannot divide by zero";
        break;
    }

    document.getElementById("result").innerText = `Result: ${result}`;
  }
</script>

</body>
</html>
